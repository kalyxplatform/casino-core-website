name: Promote to Vercel Production

# Promotes a Vercel deployment to production using a Vercel access token.
#
# Two modes:
#  1. workflow_dispatch  -> manually promote a specific (already-built) deployment URL/ID.
#  2. push to `master`     -> build a fresh production deployment and promote it.
#
# Required repository secrets:
#  - VERCEL_TOKEN       : Vercel access token (Account Settings -> Tokens)
#  - VERCEL_ORG_ID      : Vercel organization/team ID
#  - VERCEL_PROJECT_ID  : Vercel project ID

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "Existing deployment URL or ID to promote (leave empty to build a new one)"
        required: false
        type: string
  push:
    branches:
      - master

concurrency:
  group: vercel-promote-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  # `vars`, not `secrets`: both are repository VARIABLES (neither is secret — an org and a
  # project id identify, they do not authorise). Read as `secrets.*` they resolved to the
  # empty string, which left the CLI with no project to target; `vercel pull` got away with
  # it by falling back to the linked project, but `vercel env` below cannot.
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  promote:
    name: Promote
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.result.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Vercel token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # The brand key is this site's TENANCY credential (backend D-044): `webapi` resolves
      # which brand we are from it, and refuses every request without it. It is a secret, so
      # it lives in a GitHub Actions secret and is synced into the Vercel project from here
      # — never committed. This repository is PUBLIC; a key in the tree is a key on the
      # internet.
      #
      # This step exists because nobody on the team has Vercel dashboard access, but the
      # token below already grants exactly the write access needed. Delete it once the env
      # var is managed in Vercel directly.
      #
      # `process.env.BRAND_KEY` is read at RUNTIME by a server component, not inlined at
      # build time (it is deliberately not `NEXT_PUBLIC_`), so it has to exist on the Vercel
      # PROJECT — setting it only on this runner would not reach the deployed function.
      # Hence: set it before `vercel pull`, so the pulled config carries it.
      - name: Sync BRAND_KEY into the Vercel project
        run: |
          if [ -z "${{ secrets.BRAND_KEY }}" ]; then
            echo "::error::BRAND_KEY secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # Remove first so this is idempotent AND so a rotated key actually replaces the
          # old one; `vercel env add` does not overwrite. A first run has nothing to remove.
          vercel env rm BRAND_KEY production --yes \
            --token="${{ secrets.VERCEL_TOKEN }}" || true
          printf %s "${{ secrets.BRAND_KEY }}" | vercel env add BRAND_KEY production \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      # ---- Mode 1: promote an existing deployment ----------------------------
      - name: Promote existing deployment
        id: promote_existing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment != '' }}
        run: |
          echo "Promoting existing deployment: ${{ inputs.deployment }}"
          vercel promote "${{ inputs.deployment }}" \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --scope="${{ vars.VERCEL_ORG_ID }}"
          echo "url=${{ inputs.deployment }}" >> "$GITHUB_OUTPUT"

      # ---- Mode 2: build + deploy a new production release -------------------
      - name: Build production artifacts
        if: ${{ steps.promote_existing.outcome == 'skipped' }}
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      # `vercel deploy --prod` already makes this the production deployment and
      # aliases the production domain to it, so no separate promote is needed.
      - name: Deploy to production
        id: deploy_new
        if: ${{ steps.promote_existing.outcome == 'skipped' }}
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Deployed to: $DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Expose final URL
        id: result
        run: |
          URL="${{ steps.promote_existing.outputs.url || steps.deploy_new.outputs.url }}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production URL: $URL"

      - name: Summary
        run: |
          {
            echo "### Vercel promotion complete :rocket:"
            echo ""
            echo "- **Trigger:** ${{ github.event_name }}"
            echo "- **Production URL:** ${{ steps.result.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
